name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        run: |
          TAG=${{ github.ref_name == 'main' && 'latest' || 'dev' }}
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/akiba-backend:$TAG --push .

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      CONFIG_DIR: "/home/ubuntu/docker/backend/config-${{ github.ref_name == 'main' && 'prod' || 'dev' }}"
      BASE_DIR: "/home/ubuntu/docker/backend/"
      DB_PASSWORD: ${{ github.ref_name == 'main' && secrets.PROD_DB_PASSWORD || secrets.DEV_DB_PASSWORD }}
      DB_NAME: ${{ github.ref_name == 'main' && secrets.PROD_DB_NAME || secrets.DEV_DB_NAME }}
      DOCKER_COMPOSE_FILE: ${{ github.ref_name == 'main' && 'docker-compose.app.prod.yml' || 'docker-compose.app.dev.yml' }}
    steps:
      - name: SSH to EC2 and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            mkdir -p ${{ env.CONFIG_DIR }}
            
            # 1. 브랜치에 따라 사용할 값을 변수에 할당 (이름 통일 작업)
            if [ "${{ github.ref_name }}" = "main" ]; then
              FINAL_NAVER_ID="${{ secrets.NAVER_CLIENT_ID_PROD }}"
              FINAL_NAVER_SECRET="${{ secrets.NAVER_CLIENT_SECRET_PROD }}"
              CURRENT_TAG="latest"
            else
              FINAL_NAVER_ID="${{ secrets.NAVER_CLIENT_ID_DEV }}"
              FINAL_NAVER_SECRET="${{ secrets.NAVER_CLIENT_SECRET_DEV }}"
              CURRENT_TAG="dev"
            fi

            export TAG=${{ github.ref_name == 'main' && 'latest' || 'dev' }}
            export HOST_PORT=${{ github.ref_name == 'main' && '8080' || '8081' }}
            export DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}

            {
              echo "DB_NAME=${{ env.DB_NAME }}"
              echo "DB_PASSWORD=${{ env.DB_PASSWORD }}"
              echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}"
              echo "NAVER_CLIENT_ID_DEV=${{ secrets.NAVER_CLIENT_ID_DEV }}"
              echo "NAVER_CLIENT_SECRET_DEV=${{ secrets.NAVER_CLIENT_SECRET_DEV }}"
              echo "NAVER_CLIENT_ID_PROD=${{ secrets.NAVER_CLIENT_ID_PROD }}"
              echo "NAVER_CLIENT_SECRET_PROD=${{ secrets.NAVER_CLIENT_SECRET_PROD }}"
              echo "NAVER_CLIENT_ID=${{ secrets.NAVER_CLIENT_ID_DEV }}"
              echo "NAVER_CLIENT_SECRET=${{ secrets.NAVER_CLIENT_SECRET_DEV }}"
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
              echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
              echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}"
              echo "TAG=${{ github.ref_name == 'main' && 'latest' || 'dev' }}"
              echo "DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}"
              echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
              echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
              echo "AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }}"
              echo "AWS_S3_REGION=${{ secrets.AWS_S3_REGION }}"

            } > ${{ env.CONFIG_DIR }}/.env


            cd ${{ env.BASE_DIR }}
            bash deploy.sh ${{ env.DOCKER_COMPOSE_FILE }} ${{ env.CONFIG_DIR }}/.env
            
