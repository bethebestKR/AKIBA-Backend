spring:
  datasource:
    url: jdbc:mysql://db-dev:3306/${DB_NAME} #배포용 ,서버용
#    url: jdbc:mysql://localhost:3306/${DB_NAME} #local용
    username: root
    password: ${DB_PASSWORD}

discord:
  webhook:
    url: ${DISCORD_WEBHOOK_URL}

cloud:
  aws:
    s3:
      bucket: ${AWS_S3_BUCKET_NAME}
      region: ${AWS_S3_REGION}
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}